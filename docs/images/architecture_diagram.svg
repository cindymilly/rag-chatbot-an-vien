<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5394" />
      <stop offset="100%" stop-color="#073863" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9b310" />
      <stop offset="100%" stop-color="#b38f00" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#f1f5f9" rx="12"/>

  <!-- Title Header -->
  <rect x="0" y="0" width="1200" height="80" fill="url(#navyGrad)"/>
  <rect x="0" y="77" width="1200" height="3" fill="url(#goldGrad)"/>
  <text x="600" y="48" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ KIẾN TRÚC HỆ THỐNG XỬ LÝ NỘI DUNG THỦ TỤC HÀNH CHÍNH
  </text>
  <text x="600" y="68" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
    CÔNG AN XÃ AN VIỄN - THÀNH PHỐ ĐỒNG NAI
  </text>

  <!-- Step 1: User Request -->
  <g filter="url(#shadow)">
    <rect x="50" y="240" width="200" height="120" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="50" y="240" width="200" height="30" rx="8" fill="#0b5394"/>
    <text x="150" y="260" font-family="Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. YÊU CẦU CÔNG DÂN</text>
    <text x="150" y="300" font-family="Roboto, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Tiếp nhận câu hỏi</text>
    <text x="150" y="320" font-family="Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Thủ tục hành chính / PCCC</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 250 300 L 310 300" stroke="#0b5394" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="310,295 320,300 310,305" fill="#0b5394"/>

  <!-- Step 2: Query Analyzer -->
  <g filter="url(#shadow)">
    <rect x="320" y="240" width="210" height="120" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="320" y="240" width="210" height="30" rx="8" fill="#0b5394"/>
    <text x="425" y="260" font-family="Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. PHÂN TÁCH &amp; NORMALIZE</text>
    <text x="425" y="295" font-family="Roboto, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Chuẩn hóa thuật ngữ</text>
    <text x="425" y="315" font-family="Roboto, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Tách đa ý định (Multi-intent)</text>
  </g>

  <!-- Arrow 2 -> DBs -->
  <path d="M 530 280 L 610 180" stroke="#0b5394" stroke-width="2.5" fill="none"/>
  <polygon points="605,178 615,175 610,186" fill="#0b5394"/>

  <path d="M 530 320 L 610 420" stroke="#0b5394" stroke-width="2.5" fill="none"/>
  <polygon points="610,414 615,425 605,422" fill="#0b5394"/>

  <!-- Top Database: Vector DB -->
  <g filter="url(#shadow)">
    <rect x="615" y="120" width="240" height="120" rx="8" fill="url(#cardGrad)" stroke="#0b5394" stroke-width="2"/>
    <rect x="615" y="120" width="240" height="30" rx="8" fill="#0b5394"/>
    <text x="735" y="140" font-family="Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CSDL VECTOR CHROMADB</text>
    <text x="735" y="175" font-family="Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0b5394" text-anchor="middle">1.827 Vectors Tri Thức</text>
    <text x="735" y="195" font-family="Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Cư trú, Căn cước, GPLX, PCCC</text>
    <text x="735" y="215" font-family="Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">vietnamese-bi-encoder</text>
  </g>

  <!-- Bottom Database: Graph DB -->
  <g filter="url(#shadow)">
    <rect x="615" y="360" width="240" height="120" rx="8" fill="url(#cardGrad)" stroke="#d9b310" stroke-width="2"/>
    <rect x="615" y="360" width="240" height="30" rx="8" fill="#b38f00"/>
    <text x="735" y="380" font-family="Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CHỈ MỤC THỰC THỂ &amp; DANH BẠ</text>
    <text x="735" y="415" font-family="Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b38f00" text-anchor="middle">15 Cán bộ &amp; Hotlines</text>
    <text x="735" y="435" font-family="Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Phân công địa bàn Ấp</text>
    <text x="735" y="455" font-family="Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">SĐT Trực ban 02513.538.187</text>
  </g>

  <!-- DBs -> Grader Evaluator -->
  <path d="M 855 180 L 920 280" stroke="#0b5394" stroke-width="2.5" fill="none"/>
  <polygon points="915,282 925,286 920,274" fill="#0b5394"/>

  <path d="M 855 420 L 920 320" stroke="#0b5394" stroke-width="2.5" fill="none"/>
  <polygon points="920,326 925,314 915,318" fill="#0b5394"/>

  <!-- Step 4: Grader & Output -->
  <g filter="url(#shadow)">
    <rect x="925" y="240" width="225" height="120" rx="8" fill="url(#cardGrad)" stroke="#0b5394" stroke-width="2"/>
    <rect x="925" y="240" width="225" height="30" rx="8" fill="#0b5394"/>
    <text x="1037" y="260" font-family="Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">TỔNG HỢP VĂN BẢN</text>
    <text x="1037" y="295" font-family="Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Văn phong Hành chính Công</text>
    <text x="1037" y="315" font-family="Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Đầy đủ Đối tượng, Hồ sơ,</text>
    <text x="1037" y="335" font-family="Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Trình tự &amp; Thông tin liên hệ</text>
  </g>

  <!-- Footer Banner -->
  <rect x="0" y="550" width="1200" height="50" fill="#073863"/>
  <text x="600" y="580" font-family="Roboto, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
    CÔNG AN XÃ AN VIỄN - BẢO VỆ AN NINH TRẬT TỰ VÀ PHỤC VỤ NHÂN DÂN
  </text>
</svg>